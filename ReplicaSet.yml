apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: app-rs
spec:
  template:
    metadata:
      name: demo-pod
      labels:
        app: myapp
        type: front-app
    spec:
      containers:
      - name: nginx-container
        image: nginx
  replicas: 3
  selector:
    matchLabels:
      type: front-app
    